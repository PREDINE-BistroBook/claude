name: Deploy Osteria La Galleria

# Deploys sites/osteria-la-galleria (Worker + static assets + D1) to Cloudflare from GitHub's runners.
# Trigger by hand from the Actions tab, or automatically on a push to the default branch that touches the site.
#
# Repository secrets (Settings → Secrets and variables → Actions) — the same ones Zen uses:
#   CLOUDFLARE_API_TOKEN      Workers Scripts:Edit, D1:Edit (plus Workers Routes:Edit, Zone:Read, DNS:Edit once a custom domain exists)
#   CLOUDFLARE_ACCOUNT_ID     optional — read from the token when absent
#   RESEND_API_KEY            reservation / pre-order emails
#   ADMIN_BOOTSTRAP_PASSWORD  first owner login on /admin.html (only honoured while no admin exists)
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET   optional until the osteria's Stripe account is connected
# SESSION_SECRET is generated on the first run and kept as a Worker secret.

on:
  workflow_dispatch:
  push:
    branches: [claude/ai-agent-company-automation-i3l9vx, main]
    paths: ["sites/osteria-la-galleria/**", ".github/workflows/deploy-osteria.yml"]

concurrency: deploy-osteria

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/osteria-la-galleria
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g wrangler@4

      - name: Account id (from the token, unless given as a secret)
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            ID=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts" | jq -r '.result[0].id // empty')
            [ -n "$ID" ] || { echo "::error::could not determine the Cloudflare account id from the token"; exit 1; }
            echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
          fi

      - name: Database (create on first run, then apply the schema)
        run: |
          ID=$(wrangler d1 list --json | jq -r '.[] | select(.name=="osteria-la-galleria") | .uuid')
          if [ -z "$ID" ]; then
            wrangler d1 create osteria-la-galleria
            ID=$(wrangler d1 list --json | jq -r '.[] | select(.name=="osteria-la-galleria") | .uuid')
          fi
          [ -n "$ID" ] || { echo "::error::could not create or find the D1 database"; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          wrangler d1 execute osteria-la-galleria --remote --file=schema.sql

      - name: List the owner's dish photos (img/dishes → photos.js)
        run: |
          FILES=$(ls public/img/dishes 2>/dev/null | grep -Ei '\.(jpe?g|png|webp|mp4|webm)$' | sed 's/.*/"&"/' | paste -sd, -)
          printf '/* generated at deploy from img/dishes */\nwindow.DISH_PHOTOS = [%s];\n' "$FILES" > public/photos.js
          cat public/photos.js

      - name: Deploy
        run: wrangler deploy

      - name: Worker secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          ADMIN_BOOTSTRAP_EMAIL: fetta.amore.business@gmail.com
        run: |
          put() { if [ -n "${!1:-}" ]; then printf '%s' "${!1}" | wrangler secret put "$1"; else echo "  (skip $1 — secret not set)"; fi; }
          put RESEND_API_KEY
          put ADMIN_BOOTSTRAP_EMAIL
          put ADMIN_BOOTSTRAP_PASSWORD
          put STRIPE_SECRET_KEY
          put STRIPE_WEBHOOK_SECRET
          if wrangler secret list | grep -q '"SESSION_SECRET"'; then echo "  SESSION_SECRET already set"; else
            openssl rand -hex 32 | tr -d '\n' | wrangler secret put SESSION_SECRET; fi

      - name: Where it is
        run: |
          SUB=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          echo "::notice::deployed — https://osteria-la-galleria.${SUB:-<account>}.workers.dev (custom domain once routes are set in wrangler.toml)"
