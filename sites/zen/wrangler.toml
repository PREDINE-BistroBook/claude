name = "zen-recovery"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# Custom domain (must stay above the first [table] — TOML would otherwise attach it to that table).
routes = [
  { pattern = "zenrecovery.club", custom_domain = true },
  { pattern = "www.zenrecovery.club", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]   # 2026-09-13: a browser NAVIGATION to /api/auth/google (Sign in with Google) was answered by the asset layer with 404.html and never reached the Worker; API paths now always run the Worker first

# Database. Create once with:  npx wrangler d1 create zen-recovery   → paste the id below,
# then:  npx wrangler d1 execute zen-recovery --remote --file=schema.sql
# Hourly: reminders the day before, follow-ups two days after, birthday credits, waitlist alerts (src/cron.js)
[triggers]
crons = ["15 * * * *"]

# Before/after photos. R2 must be enabled once in the Cloudflare dashboard (R2 → accept terms); until then photos are
# stored in D1 and the deploy workflow leaves these lines commented out. It uncomments them automatically once the bucket exists.
#R2# [[r2_buckets]]
#R2# binding = "PHOTOS"
#R2# bucket_name = "zen-photos"

[ai]
binding = "AI"   # Workers AI: translates team profiles to Italian / Arabic on save (and hourly for anything missing)

[[d1_databases]]
binding = "DB"
database_name = "zen-recovery"
database_id = "35c5461a-9065-4552-a6bf-bac39d1ec8f8"   # created 2026-09-12 (WEUR)

# Secrets (never committed) — set each with `npx wrangler secret put NAME`:
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY,
#   SESSION_SECRET (any long random string, signs login cookies), GOOGLE_CLIENT_SECRET (optional, Google sign-in),
#   ADMIN_BOOTSTRAP_EMAIL + ADMIN_BOOTSTRAP_PASSWORD (first owner login; only honoured while no admin exists yet)

[vars]
SITE_URL = "https://zenrecovery.club"
ZEN_STRIPE_ACCOUNT = ""          # acct_... of Zen's connected account. Empty = preview mode (no card payments).
ZEN_NOTIFY_EMAIL = ""   # optional extra address for new bookings / gifts / review requests. Empty: only admins with "email me about bookings" on get them (Amico Mio never does)
FROM_EMAIL = "Zen Recovery <booking@zenrecovery.club>"   # domain verified on Resend 2026-09-12
GOOGLE_CLIENT_ID = "329793656753-nmee0krmfa7h8m4sqcdu59nf9uadgm7e.apps.googleusercontent.com"           # OAuth 2.0 Web client id from Google Cloud Console; empty = Google button hidden. Secret: GOOGLE_CLIENT_SECRET
APPLE_CLIENT_ID = ""            # Apple "Services ID" (e.g. club.zenrecovery.web); with APPLE_TEAM_ID, APPLE_KEY_ID and the secret APPLE_PRIVATE_KEY (.p8 contents)
APPLE_TEAM_ID = ""
APPLE_KEY_ID = ""
WA_PHONE_ID = ""                # WhatsApp Cloud API phone number id; secret WA_TOKEN. Templates below must be approved in Meta Business
WA_TEMPLATE_REMINDER = "zen_reminder"
WA_TEMPLATE_FOLLOWUP = "zen_followup"
TWILIO_FROM = ""                # SMS sender (e.g. +1…); secrets TWILIO_SID, TWILIO_TOKEN. Empty = "text me the link" hidden
DEV_MAGIC_LINK = "0"             # "1" only on a local dev run: returns the sign-in link in the API response instead of relying on email
