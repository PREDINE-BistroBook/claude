<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zen Recovery · My data</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="app.css">
<style>
  .wrap{max-width:820px}
  h1{margin-bottom:4px} .lead{color:var(--ink-soft);margin-bottom:22px}
  section{margin:22px 0} section h2{font-size:1.2rem;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  dl{display:grid;grid-template-columns:160px 1fr;gap:4px 12px;font-size:.92rem;margin:0} dt{color:var(--ink-soft)} dd{margin:0}
  table{font-size:.86rem} .toolbar{display:flex;gap:10px;margin-bottom:16px}
  @media print{.toolbar,.top{display:none} body{background:#fff} .wrap{padding:0}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="index.html"><img class="logo" src="img/logo-light.png" alt="Zen Recovery" width="112" height="40"></a><nav><a href="account.html">My account</a></nav></header>
<main class="wrap">
  <div class="toolbar"><button class="btn small" onclick="print()">Print / save as PDF</button><a class="btn small ghost" href="/api/me/export" download="zen-recovery-data.json">Download JSON</a></div>
  <h1>Your data at Zen Recovery</h1>
  <p class="lead" id="lead">Loading…</p>
  <div id="out"></div>
</main>
<script src="i18n.js"></script>
<script src="guide.js"></script>
<script src="demo.js"></script>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const G = window.ZenGuide, CITY = { cairo: "Cairo", dahab: "Dahab", florence: "Florence" };
const money = (minor, cur) => new Intl.NumberFormat("en", { style: "currency", currency: (cur || "eur").toUpperCase(), maximumFractionDigits: cur === "egp" ? 0 : 2 }).format(minor / 100);
(async () => {
  let d; try { d = await ZenAPI("GET", "/api/me/export"); } catch (e) { document.getElementById("lead").textContent = "Sign in first, then open this page again."; return; }
  const u = d.user, i = u.intake || {};
  document.getElementById("lead").textContent = `Exported ${d.exported_at} for ${u.name} (${u.email}). This is everything Zen Recovery holds about you.`;
  const lbl = (g, id) => G.label(g, id);
  document.getElementById("out").innerHTML = `
    <section><h2>Profile</h2><dl><dt>Name</dt><dd>${esc(u.name)}</dd><dt>Email</dt><dd>${esc(u.email)}</dd><dt>Phone</dt><dd>${esc(u.phone || "—")}</dd><dt>Birthday</dt><dd>${esc(u.birthday || "—")}</dd><dt>Lives in</dt><dd>${esc(u.city_text || "—")} ${u.country ? "(" + u.country + ")" : ""}</dd><dt>Room</dt><dd>${CITY[u.nearest_city || u.city] || "—"}</dd><dt>Language</dt><dd>${esc(u.lang || "en")}</dd><dt>Invite code</dt><dd>${esc(u.referral_code)}</dd><dt>Account since</dt><dd>${esc(u.created_at)}</dd><dt>Notes for therapist</dt><dd>${esc(u.notes || "—")}</dd></dl></section>
    <section><h2>Questionnaire</h2>${u.intake ? `<dl><dt>Goals</dt><dd>${(i.goals || []).map((g) => lbl("goals", g)).join(", ") || "—"}</dd><dt>Focus areas</dt><dd>${(i.pain || []).map((p) => lbl("pain", p)).join(", ") || "—"}</dd><dt>Activity</dt><dd>${i.activity ? lbl("activity", i.activity) : "—"}${i.sport ? " · " + esc(i.sport) : ""}</dd><dt>Experience</dt><dd>${i.experience ? lbl("experience", i.experience) : "—"}</dd><dt>Health</dt><dd>${(i.health || []).map((h) => lbl("health", h)).join(", ") || "—"}${i.health_notes ? "<br>" + esc(i.health_notes) : ""}</dd><dt>Contact</dt><dd>${i.contact ? lbl("contact", i.contact) : "—"} · ${i.time_pref ? lbl("time", i.time_pref) : "—"}</dd><dt>Completed</dt><dd>${esc(i.completed_at || "—")}</dd></dl>` : "<p class='tiny'>Not filled in.</p>"}</section>
    <section><h2>Sessions (${d.bookings.length})</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>City</th><th>Session</th><th>Paid</th><th>Status</th><th>Your rating</th><th>Therapist's note</th></tr></thead><tbody>${d.bookings.map((b) => `<tr><td>${b.date} ${esc(b.slot || "")}</td><td>${CITY[b.city]}</td><td>${esc(b.service_name)}</td><td>${b.amount === 0 ? "Free" : money(b.amount, b.currency)}</td><td>${b.status}</td><td>${b.rating ? "★".repeat(b.rating) + (b.feedback ? " " + esc(b.feedback) : "") : ""}</td><td>${esc(b.therapist_note || "")}</td></tr>`).join("") || "<tr><td colspan='7'>None</td></tr>"}</tbody></table></div></section>
    <section><h2>Check-ins (${d.checkins.length})</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>Pain</th><th>Energy</th><th>Sleep</th><th>Note</th></tr></thead><tbody>${d.checkins.map((c) => `<tr><td>${c.date}</td><td>${c.pain}/10</td><td>${c.energy ?? "–"}</td><td>${c.sleep ?? "–"}</td><td>${esc(c.note || "")}</td></tr>`).join("") || "<tr><td colspan='5'>None</td></tr>"}</tbody></table></div></section>
    <section><h2>Rewards (${d.credits.length})</h2><ul>${d.credits.map((c) => `<li>${c.pct === 100 ? "Free session" : c.pct + "% off"} · ${esc(c.reason)} · ${c.status} · ${c.created_at}</li>`).join("") || "<li>None</li>"}</ul></section>
    <section><h2>Packs (${d.packages.length})</h2><ul>${d.packages.map((p) => `<li>${esc(p.name)} · ${CITY[p.city]} · ${p.remaining}/${p.sessions} left · ${money(p.amount, p.currency)} · valid until ${p.expires_at || "—"}</li>`).join("") || "<li>None</li>"}</ul></section>
    <section><h2>Photos (${d.photos.length})</h2><ul>${d.photos.map((p) => `<li>${p.kind} · ${p.created_at} · <a href="${esc(p.url)}">${esc(p.url)}</a></li>`).join("") || "<li>None</li>"}</ul></section>
    <section><h2>Messages we sent you (${d.messages.length})</h2><ul>${d.messages.map((m) => `<li>${m.kind} by ${m.channel} · ${m.status} · ${m.created_at}</li>`).join("") || "<li>None</li>"}</ul></section>`;
})();
</script>
</body>
</html>
