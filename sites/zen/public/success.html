<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zen — reserved</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&family=Figtree:wght@400;500&display=swap">
<style>
  :root{--ground:#E7EDE8;--ink:#14302C;--ink-soft:#42605A;--mark:#7C3A4E;--glass:rgba(255,255,255,.62)}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px 16px}
  main{max-width:34rem;text-align:center;display:grid;gap:22px;justify-items:center}
  .core{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 42% 38%,#fff 0,var(--glass) 30%,rgba(124,58,78,.22) 70%,rgba(124,58,78,.45) 100%);box-shadow:inset 0 0 30px rgba(255,255,255,.7);animation:breathe 8s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(.94)}50%{transform:scale(1.04)}}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:300;font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;margin:0;font-variation-settings:"SOFT" 100,"opsz" 96}
  p{margin:0;color:var(--ink-soft);line-height:1.55}
  a{display:inline-block;margin-top:8px;padding:12px 20px;border-radius:999px;background:var(--ink);color:var(--ground);text-decoration:none;font-weight:500}
  @media (prefers-reduced-motion:reduce){.core{animation:none}}
</style>
</head>
<body>
<main>
  <div class="core" aria-hidden="true"></div>
  <h1>Reserved. Breathe out.</h1>
  <p id="msg">Your payment went through and a confirmation is on its way to your inbox. Zen will message you on WhatsApp to agree the exact hour.</p>
  <p>Until then: drink water, and don't plan anything strenuous for that day.</p>
  <a href="/">Back to Zen</a>
</main>
<script>if (new URLSearchParams(location.search).get("free")) document.getElementById("msg").textContent = "Your free session is reserved and a confirmation is on its way to your inbox. Zen will message you on WhatsApp to agree the exact hour.";</script>
</body>
</html>
