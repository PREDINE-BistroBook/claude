<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Sala — Osteria La Galleria</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E1A17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231E1A17'/%3E%3Crect x='11' y='11' width='42' height='42' fill='none' stroke='%23C9A55C' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Work+Sans:wght@400;500;600&display=swap">
<style>
:root { --bg: #1E1A17; --panel: #2A2320; --paper: #F6EFE1; --ink: #F2E8D5; --muted: rgba(242,232,213,.7); --gold: #C9A55C; --gold-soft: rgba(201,165,92,.4); --ok: #6FA46A; --warn: #E8A64A; --bad: #D9584A; --blue: #6C9BD2; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Work Sans", system-ui, sans-serif; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: "Bodoni Moda", Georgia, serif; font-weight: 400; margin: 0; }
.hide { display: none !important; }
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid rgba(255,255,255,.08); }
.top .brand { font-family: "Bodoni Moda", Georgia, serif; font-style: italic; font-size: 1.25rem; }
.top .brand small { font-family: "Work Sans"; font-style: normal; font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-left: 8px; }
.tabs { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; }
.tabs button { background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 8px 14px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.tabs button.on { background: var(--paper); color: #1E1A17; }
.tabs button:hover { border-color: var(--gold-soft); color: var(--ink); }
.who { font-size: .8rem; color: var(--muted); }
.who button { background: none; border: 1px solid var(--gold-soft); border-radius: 999px; padding: 6px 12px; cursor: pointer; margin-left: 8px; }
main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 80px; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.live i { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
.live.on i { background: var(--ok); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 16px 0 26px; }
.tile { background: var(--panel); border: 1px solid rgba(255,255,255,.06); border-radius: 4px; padding: 14px 16px; }
.tile b { display: block; font-family: "Bodoni Moda", Georgia, serif; font-size: 2rem; line-height: 1; font-weight: 400; }
.tile span { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.tile.warn b { color: var(--warn); }
.card { background: var(--panel); border: 1px solid rgba(255,255,255,.06); border-radius: 4px; padding: 18px; margin-bottom: 18px; }
.card h2 { font-size: 1.5rem; margin-bottom: 10px; }
.help { font-size: .84rem; color: var(--muted); margin: 0 0 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 14px; }
label.f { display: grid; gap: 4px; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
label.f input, label.f select, label.f textarea { background: #1E1A17; border: 1px solid rgba(255,255,255,.14); border-radius: 3px; padding: 9px 11px; color: var(--ink); min-width: 0; font-size: .95rem; text-transform: none; letter-spacing: 0; }
label.f input[type="date"] { color-scheme: dark; }
label.f input[type="color"] { height: 44px; width: 90px; padding: 4px; cursor: pointer; }
label.f.grow { flex: 1; min-width: 160px; }
.btn { background: var(--paper); color: #1E1A17; border: 1px solid var(--paper); border-radius: 3px; padding: 9px 16px; cursor: pointer; font-weight: 600; font-size: .82rem; letter-spacing: .1em; text-transform: uppercase; }
.btn:hover { background: var(--gold); border-color: var(--gold); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--gold-soft); }
.btn.ghost:hover { border-color: var(--gold); }
.btn.sm { padding: 6px 10px; font-size: .72rem; }
.btn.danger { background: transparent; color: #F0B8A8; border-color: rgba(217,88,74,.5); }
.btn:disabled { opacity: .5; cursor: default; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; border: 1px solid; }
.pill.requested { color: var(--warn); border-color: var(--warn); }
.pill.confirmed { color: var(--blue); border-color: var(--blue); }
.pill.seated { color: var(--ok); border-color: var(--ok); }
.pill.done { color: var(--muted); border-color: var(--muted); }
.pill.cancelled, .pill.no_show { color: #F0B8A8; border-color: rgba(217,88,74,.6); }
.pill.paid { color: var(--gold); border-color: var(--gold); }
.pill.served { color: var(--muted); border-color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th { text-align: left; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.1); }
td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,.06); vertical-align: top; }
tr.row { cursor: pointer; }
tr.row:hover td { background: rgba(255,255,255,.03); }
td .sub { display: block; font-size: .8rem; color: var(--muted); }
.time { font-family: "Bodoni Moda", Georgia, serif; font-size: 1.25rem; }
.svc { font-family: "Bodoni Moda", Georgia, serif; font-style: italic; font-size: 1.3rem; color: var(--gold); margin: 22px 0 8px; }
.empty { padding: 30px 10px; text-align: center; color: var(--muted); font-style: italic; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.err { color: #F0B8A8; font-size: .86rem; margin: 8px 0 0; }
.okmsg { color: var(--ok); font-size: .86rem; margin: 8px 0 0; }
.drawer { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; justify-content: flex-end; z-index: 20; }
.drawer .panel { width: min(520px, 100%); background: var(--panel); height: 100%; overflow: auto; padding: 22px; border-left: 1px solid rgba(255,255,255,.08); }
.drawer h2 { margin-bottom: 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.items { margin: 6px 0 0; padding: 0; list-style: none; font-size: .9rem; }
.items li { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px dotted rgba(255,255,255,.12); }
.chk { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.chk label { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; text-transform: none; letter-spacing: 0; }
.login { max-width: 400px; margin: 60px auto; }
.login h1 { font-size: 2rem; margin-bottom: 6px; }
.login p { color: var(--muted); font-size: .9rem; }
.ticket { background: var(--paper); color: #1E1A17; border-radius: 4px; padding: 14px 16px; margin-bottom: 12px; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; }
.ticket h3 { font-size: 1.2rem; }
.ticket .items li { border-color: rgba(0,0,0,.2); }
.ticket .meta { font-size: .8rem; color: #6E6459; }
@media print { .top, .bar, .actions, .btn, .tiles, .help { display: none !important; } body { background: #fff; color: #000; } .ticket { border: 1px solid #000; page-break-inside: avoid; } }
/* menu editor */
.savestate { margin-left: auto; font-size: .8rem; color: var(--muted); align-self: center; }
.savestate.ok { color: var(--ok); } .savestate.warn { color: var(--warn); } .savestate.bad { color: #F0B8A8; }
details.room { background: var(--panel); border: 1px solid rgba(255,255,255,.06); border-radius: 4px; margin-bottom: 12px; }
details.room.off { opacity: .6; }
details.room > summary { display: flex; align-items: baseline; gap: 12px; padding: 14px 18px; cursor: pointer; list-style: none; }
details.room > summary::-webkit-details-marker { display: none; }
details.room > summary .rn { font-family: "Bodoni Moda", Georgia, serif; font-size: 1.4rem; color: var(--gold); min-width: 2.2em; }
details.room > summary b { font-family: "Bodoni Moda", Georgia, serif; font-weight: 400; font-size: 1.3rem; }
details.room > summary .sub { font-size: .8rem; color: var(--muted); margin-left: auto; text-align: right; }
.roomedit { padding: 0 18px 14px; border-bottom: 1px solid rgba(255,255,255,.06); margin-bottom: 8px; }
.cover { display: grid; grid-template-columns: 200px 1fr; gap: 14px; align-items: start; margin: 4px 0 14px; }
.cover img, .cover .nocover { display: block; width: 200px; aspect-ratio: 4 / 3; object-fit: cover; border: 1px solid var(--gold-soft); background: #000; }
.cover .nocover svg { display: block; width: 100%; height: 100%; }
.cover.dish { grid-template-columns: 240px 1fr; } .cover.dish img, .cover.dish .nocover { width: 240px; }
.group { padding: 4px 18px 8px; }
.group h3 { font-size: 1.1rem; color: var(--gold); margin: 8px 0 4px; }
.group .gt { margin: 6px 0 4px; }
tr.dish.out .name, tr.dish.out .tdth { opacity: .45; } tr.dish.out .name { text-decoration: line-through; }
tr.dish.off .name, tr.dish.off .tdth { opacity: .45; }
.tdth { width: 76px; } .th { display: block; width: 64px; aspect-ratio: 4 / 3; overflow: hidden; border: 1px solid var(--gold-soft); background: #000; }
.th img, .th svg { display: block; width: 100%; height: 100%; object-fit: cover; }
.tdname input.name { width: 100%; background: transparent; border: 0; border-bottom: 1px dashed rgba(255,255,255,.2); padding: 4px 0; font-family: "Bodoni Moda", Georgia, serif; font-size: 1.1rem; }
.tdname input.name:focus { outline: none; border-bottom-color: var(--gold); }
.tdname .name { font-family: "Bodoni Moda", Georgia, serif; font-size: 1.1rem; }
.tdprice { width: 110px; white-space: nowrap; font-family: "Bodoni Moda", Georgia, serif; font-size: 1.15rem; }
.tdprice input { width: 90px; background: #1E1A17; border: 1px solid rgba(255,255,255,.14); border-radius: 3px; padding: 6px 8px; font-family: "Bodoni Moda", Georgia, serif; font-size: 1.1rem; text-align: right; }
.tdout { width: 120px; white-space: nowrap; }
.sw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: .8rem; color: var(--muted); }
.sw input { position: absolute; opacity: 0; width: 0; height: 0; }
.sw span { width: 38px; height: 22px; border-radius: 999px; background: rgba(255,255,255,.15); position: relative; transition: background .2s; flex: none; }
.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); transition: left .2s; }
.sw input:checked + span { background: #B04A3A; } .sw input:checked + span::after { left: 19px; }
.sw input:focus-visible + span { outline: 2px solid var(--gold); }
.tdact { width: 210px; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 2px; padding: 4px 6px 4px 10px; border: 1px solid var(--gold-soft); border-radius: 999px; font-size: .85rem; }
.chip b { font-weight: 500; margin-right: 4px; }
.chip button { background: transparent; border: 0; color: var(--muted); cursor: pointer; padding: 2px 5px; font-size: .95rem; }
.chip button:hover:not(:disabled) { color: var(--ink); } .chip button:disabled { opacity: .3; cursor: default; }
.inglist { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 8px; }
.ingbtn { display: grid; gap: 4px; background: #1E1A17; border: 1px solid rgba(255,255,255,.12); border-radius: 3px; padding: 6px; cursor: pointer; font-size: .78rem; text-align: center; }
.ingbtn:hover { border-color: var(--gold); }
.ingbtn svg { display: block; width: 100%; aspect-ratio: 4 / 3; background: #3E1219; }
.grid3 { display: grid; grid-template-columns: 1fr 90px 110px auto; gap: 10px; align-items: end; margin-bottom: 8px; }
.hhitems { margin-top: 12px; } .hhitems summary { cursor: pointer; color: var(--gold); }
.hhitems input#hh-filter { width: 100%; margin: 10px 0; background: #1E1A17; border: 1px solid rgba(255,255,255,.14); border-radius: 3px; padding: 8px 10px; }
.hhitems .chk { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); max-height: 320px; overflow: auto; }
.hhitems .chk small { color: var(--muted); }
/* QR cards */
.qrgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-bottom: 10px; }
.qrcard { background: var(--panel); border: 1px solid rgba(255,255,255,.06); border-radius: 4px; padding: 12px; text-align: center; display: grid; gap: 6px; justify-items: center; }
.qrcard canvas { width: 100%; max-width: 180px; height: auto; border: 1px solid var(--gold-soft); }
.qrcard.casa canvas { max-width: 240px; }
.qcod { font-family: "Bodoni Moda", Georgia, serif; font-size: 1.5rem; }
.qdove { font-size: .72rem; color: var(--muted); word-break: break-all; }
.svc small { font-family: "Work Sans"; font-style: normal; font-size: .75rem; color: var(--muted); letter-spacing: .1em; margin-left: 8px; }
@media print { .qrgrid { grid-template-columns: repeat(3, 1fr); gap: 10mm; } .qrcard { background: #fff; color: #000; border: 1px dashed #999; break-inside: avoid; } .qrcard canvas { max-width: 100%; border: 0; } .qdove { color: #666; } .svc { color: #000; } .savestate { display: none; } }
@media (max-width: 700px) { .tdname .sub { display: none; } .tdth { width: 56px; } .th { width: 48px; } .tdprice { width: 84px; } .tdprice input { width: 72px; padding: 6px 4px; font-size: 1rem; } .tdout { width: 60px; } .sw { font-size: 0; gap: 0; } td { padding: 8px 4px; } .tdact .actions { flex-direction: column; } .cover, .cover.dish { grid-template-columns: 1fr; } .cover img, .cover .nocover, .cover.dish img, .cover.dish .nocover { width: 100%; } .tdact { width: auto; } .grid3 { grid-template-columns: 1fr 70px 80px auto; } details.room > summary .sub { margin-left: 0; text-align: left; width: 100%; } details.room > summary { flex-wrap: wrap; } }
@media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } .top { flex-wrap: wrap; } .tabs { margin-left: 0; width: 100%; } td, th { padding: 8px 6px; } }
</style>
</head>
<body>
<div class="top" id="top">
  <span class="brand">La Galleria<small>Sala</small></span>
  <nav class="tabs" id="tabs"></nav>
  <span class="who" id="who"></span>
</div>
<main id="main"></main>
<script src="art.js"></script>
<script src="qrcode.min.js"></script>
<script>
(function () {
  "use strict";
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const eur = m => new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format((m || 0) / 100);
  const api = async (path, opts) => { const r = await fetch(path, { headers: { "content-type": "application/json" }, ...opts }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || ("Errore " + r.status)); return j; };
  const post = (p, b) => api(p, { method: "POST", body: JSON.stringify(b) });
  const patch = (p, b) => api(p, { method: "PATCH", body: JSON.stringify(b) });
  const put = (p, b) => api(p, { method: "PUT", body: JSON.stringify(b) });
  const today = () => new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Rome" })).toISOString().slice(0, 10);
  const addDays = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
  const dateIt = d => new Date(d + "T12:00:00Z").toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
  const ST = { requested: "Da confermare", confirmed: "Confermata", seated: "Al tavolo", done: "Conclusa", cancelled: "Disdetta", no_show: "Non venuti" };
  let me = null, live = false, settings = null;

  /* ---------- login ---------- */
  function loginView(msg) {
    $("#tabs").innerHTML = ""; $("#who").innerHTML = "";
    $("#main").innerHTML = '<div class="login card"><h1>Sala</h1><p>Prenotazioni, pre-ordini, il menu e le impostazioni dell\'Osteria La Galleria. Solo per il personale.</p>' +
      '<form id="login"><label class="f">Email o nome utente<input name="email" autocomplete="username" required></label><br><label class="f">Password<input name="password" type="password" autocomplete="current-password" required></label><br><button class="btn" type="submit">Entra</button><p class="err" id="lerr">' + esc(msg || "") + "</p></form></div>";
    $("#login").addEventListener("submit", async e => {
      e.preventDefault(); const f = new FormData(e.target);
      try { const j = await post("/api/admin/login", { email: f.get("email"), password: f.get("password") }); me = j.admin; live = j.live; boot(); } catch (err) { $("#lerr").textContent = err.message; }
    });
  }

  /* ---------- shell ---------- */
  const TABS = [["oggi", "Oggi"], ["prenotazioni", "Prenotazioni"], ["ordini", "Pre-ordini"], ["menu", "Menu"], ["locale", "Il locale"], ["qr", "QR"], ["impostazioni", "Impostazioni"], ["accessi", "Accessi"]];
  function boot() {
    const allowed = me.role === "platform" ? ["oggi"] : me.role === "owner" ? TABS.map(t => t[0]) : ["oggi", "prenotazioni", "ordini", "menu", "qr", "accessi"];
    $("#tabs").innerHTML = TABS.filter(t => allowed.includes(t[0])).map(t => '<button data-tab="' + t[0] + '">' + t[1] + "</button>").join("");
    $("#who").innerHTML = esc(me.name || me.email || me.username) + ' <span class="live' + (live ? " on" : "") + '"><i></i>' + (live ? "pagamenti attivi" : "pagamenti spenti") + '</span><button id="logout">Esci</button>';
    $("#logout").addEventListener("click", async () => { await post("/api/admin/logout", {}); me = null; loginView(); });
    document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));
    const h = location.hash.replace("#", "");
    show(allowed.includes(h) ? h : "oggi");
  }
  function show(tab) {
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
    history.replaceState(null, "", "#" + tab);
    ({ oggi, prenotazioni, ordini, menu, locale, qr, impostazioni, accessi })[tab]();
  }

  /* ---------- Oggi ---------- */
  async function oggi() {
    const m = $("#main"); m.innerHTML = '<p class="help">Un attimo…</p>';
    const [s, r] = await Promise.all([api("/api/admin/stats"), me.role === "platform" ? null : api("/api/admin/reservations?from=" + today() + "&to=" + today())]);
    let h = '<h1>Oggi, ' + dateIt(s.date) + "</h1>" +
      '<div class="tiles"><div class="tile"><b>' + s.today.covers + "</b><span>coperti oggi · " + s.today.reservations + " tavoli</span></div>" +
      '<div class="tile"><b>' + s.week.covers + "</b><span>coperti nei prossimi 7 giorni</span></div>" +
      '<div class="tile' + (s.requested ? " warn" : "") + '"><b>' + s.requested + "</b><span>richieste da confermare</span></div>" +
      '<div class="tile"><b>' + eur(s.preorders_upcoming.amount) + "</b><span>pre-ordini pagati in arrivo · " + s.preorders_upcoming.n + "</span></div>" +
      '<div class="tile"><b>' + eur(s.preorders_month.amount) + "</b><span>pre-ordini pagati questo mese</span></div>" +
      (s.platform_fee_month !== undefined ? '<div class="tile"><b>' + eur(s.platform_fee_month) + "</b><span>commissione piattaforma, mese</span></div>" : "") + "</div>";
    if (!r) { m.innerHTML = h + '<p class="help">Questo accesso vede solo i numeri.</p>'; return; }
    h += '<p class="help">I tavoli di oggi in ordine di orario. Un tocco su un tavolo apre la scheda; i bottoni cambiano lo stato al volo.</p>' + timeline(r.reservations);
    m.innerHTML = h; wireRows(() => oggi());
  }
  function timeline(list) {
    if (!list.length) return '<p class="empty">Nessuna prenotazione.</p>';
    const groups = {}; for (const r of list) { const k = Number(r.time.slice(0, 2)) < 17 ? "Pranzo" : "Cena"; (groups[k] ||= []).push(r); }
    return Object.entries(groups).map(([k, rows]) => '<p class="svc">' + k + " · " + rows.reduce((a, r) => a + (["cancelled", "no_show"].includes(r.status) ? 0 : r.party), 0) + " coperti</p>" + table(rows)).join("");
  }
  function table(rows) {
    return '<table><thead><tr><th>Ora</th><th>Nome</th><th>Persone</th><th>Tavolo</th><th>Stato</th><th>Pre-ordine</th><th></th></tr></thead><tbody>' + rows.map(r =>
      '<tr class="row" data-id="' + r.id + '"><td class="time">' + r.time + '</td><td>' + esc(r.name) + '<span class="sub">' + esc([r.phone, r.email].filter(Boolean).join(" · ")) + (r.note ? '<br>“' + esc(r.note) + "”" : "") + (r.source === "manual" ? " · telefono" : "") + "</span></td><td>" + r.party + "</td><td>" + esc(r.table_no || "—") + '</td><td><span class="pill ' + r.status + '">' + ST[r.status] + "</span></td><td>" +
      (r.orders.length ? r.orders.map(o => '<span class="pill ' + o.status + '">' + (o.status === "paid" ? "pagato " : "servito ") + eur(o.amount) + "</span>").join(" ") : '<span class="sub">—</span>') + '</td><td class="actions">' + quick(r) + "</td></tr>").join("") + "</tbody></table>";
  }
  function quick(r) {

  // A photo from the owner's phone: cover-cropped and shrunk in the browser, then stored by the Worker.
  function pickImage(W, H) {
    return new Promise(resolve => {
      const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return resolve(null);
        const img = new Image(); const url = URL.createObjectURL(f);
        img.onload = () => {
          const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");
          const s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s;
          g.fillStyle = "#1E1A17"; g.fillRect(0, 0, W, H); g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
          let q = 0.84, data; do { data = c.toDataURL("image/webp", q); q -= 0.1; } while (data.length > 1100000 && q > 0.3);
          if (!data.startsWith("data:image/webp")) { q = 0.8; do { data = c.toDataURL("image/jpeg", q); q -= 0.1; } while (data.length > 1100000 && q > 0.3); }
          URL.revokeObjectURL(url); resolve(data);
        };
        img.onerror = () => { URL.revokeObjectURL(url); alert("Non riesco a leggere questa immagine. Prova con un JPEG o un PNG (le foto HEIC dell'iPhone vanno prima convertite: Impostazioni → Fotocamera → Formati → Più compatibile)."); resolve(null); };
        img.src = url;
      };
      inp.click();
    });
  }

  const pathOf = el => el.dataset.p.split(",").map(Number);
  function wireRooms() {
    const root = $("#rooms");
    root.querySelectorAll("[data-out]").forEach(cb => cb.addEventListener("change", async () => {
      const id = cb.dataset.out; let hit = null; MENU.rooms.forEach(r => r.groups.forEach(g => g.items.forEach(d => { if (d.id === id) hit = d; })));
      try { const j = await patch("/api/admin/menu/item", { id, out: cb.checked }); MENU.ver = j.ver; if (hit) { if (cb.checked) hit.out = true; else delete hit.out; } cb.closest("tr").classList.toggle("out", cb.checked); setSaveState(cb.checked ? "Segnato esaurito" : "Di nuovo in carta", "ok"); }
      catch (err) { cb.checked = !cb.checked; alert(err.message); }
    }));
    if (me.role !== "owner") return;
    root.querySelectorAll("[data-rf]").forEach(inp => inp.addEventListener("input", () => { const r = MENU.rooms[inp.dataset.r]; const [a, b] = inp.dataset.rf.split("."); if (b) { r[a] = r[a] || { it: "", en: "" }; r[a][b] = inp.value; } else r[a] = inp.value; if (a === "title" && b === "it") inp.closest("details").querySelector("summary b").textContent = inp.value; scheduleSave(); }));
    root.querySelectorAll("[data-gf]").forEach(inp => inp.addEventListener("input", () => { const g = MENU.rooms[inp.dataset.r].groups[inp.dataset.g]; g.title = g.title || { it: "", en: "" }; g.title[inp.dataset.gf] = inp.value; scheduleSave(); }));
    root.querySelectorAll("[data-df]").forEach(inp => inp.addEventListener("input", () => { const d = MENU.rooms[inp.dataset.r].groups[inp.dataset.g].items[inp.dataset.i]; d[inp.dataset.df] = inp.dataset.df === "price" ? Math.max(0, Number(inp.value) || 0) : inp.value; scheduleSave(); }));
    root.querySelectorAll("[data-cover]").forEach(b => b.addEventListener("click", async () => { const r = MENU.rooms[b.dataset.cover]; if (await uploadMedia("room_" + r.id, 1400, 1050)) renderRooms(); }));
    root.querySelectorAll("[data-uncover]").forEach(b => b.addEventListener("click", async () => { const r = MENU.rooms[b.dataset.uncover]; if (await removeMedia("room_" + r.id)) renderRooms(); }));
    root.querySelectorAll("[data-rmove]").forEach(b => b.addEventListener("click", () => { const i = Number(b.dataset.r), j = i + Number(b.dataset.rmove); [MENU.rooms[i], MENU.rooms[j]] = [MENU.rooms[j], MENU.rooms[i]]; renderRooms(); scheduleSave(); }));
    root.querySelectorAll("[data-rhide]").forEach(b => b.addEventListener("click", () => { const r = MENU.rooms[b.dataset.rhide]; if (r.hidden) delete r.hidden; else r.hidden = true; renderRooms(); scheduleSave(); }));
    root.querySelectorAll("[data-rdel]").forEach(b => b.addEventListener("click", () => { const r = MENU.rooms[b.dataset.rdel]; if (MENU.rooms.length < 2) return alert("Deve restare almeno una sala."); if (!confirm("Eliminare la sala “" + r.title.it + "” con i suoi " + count(r) + " piatti?")) return; MENU.rooms.splice(Number(b.dataset.rdel), 1); renderRooms(); scheduleSave(); }));
    root.querySelectorAll("[data-addgroup]").forEach(b => b.addEventListener("click", () => { MENU.rooms[b.dataset.addgroup].groups.push({ title: { it: "Nuovo gruppo", en: "New group" }, items: [] }); renderRooms(); scheduleSave(); }));
    root.querySelectorAll("[data-gdel]").forEach(b => b.addEventListener("click", () => { const [ri, gi] = b.dataset.gdel.split(",").map(Number); MENU.rooms[ri].groups.splice(gi, 1); renderRooms(); scheduleSave(); }));
    root.querySelectorAll("[data-additem]").forEach(b => b.addEventListener("click", () => { const [ri, gi] = b.dataset.additem.split(",").map(Number); const d = { id: dishId("nuovo-piatto-" + Date.now().toString(36)), it: "Nuovo piatto", en: "", dit: "", price: 0, a: [], base: "plate", steps: [] }; MENU.rooms[ri].groups[gi].items.push(d); editDish(ri, gi, MENU.rooms[ri].groups[gi].items.length - 1, true); }));
    root.querySelectorAll("[data-imove]").forEach(b => b.addEventListener("click", () => { const [ri, gi, ii] = pathOf(b); const items = MENU.rooms[ri].groups[gi].items; const j = ii + Number(b.dataset.imove); [items[ii], items[j]] = [items[j], items[ii]]; renderRooms(); scheduleSave(); }));
    root.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => { const [ri, gi, ii] = b.dataset.edit.split(",").map(Number); editDish(ri, gi, ii, false); }));
  }
  /* The full card of one dish: names, description, price, allergens, flags, the photo, and the drawing's recipe. */
  function editDish(ri, gi, ii, isNew) {
    const room = MENU.rooms[ri], d = MENU.rooms[ri].groups[gi].items[ii];
    const w = { ...d, a: (d.a || []).slice(), steps: (d.steps || []).slice() };
    const ingList = Object.entries(ART.ING).map(([k, v]) => ({ k, it: v.it, en: v.en })).sort((a, b) => a.it.localeCompare(b.it, "it"));
    const bases = Object.entries(ART.BASE).map(([k, v]) => '<option value="' + k + '"' + (k === (w.base || "plate") ? " selected" : "") + ">" + esc(v.it) + "</option>").join("");
    const dr = drawer('<h2>' + (isNew ? "Nuovo piatto" : esc(d.it)) + '</h2><p class="help">Sala ' + esc(room.numeral) + " · " + esc(room.title.it) + "</p>" +
      '<div class="grid2"><label class="f">Nome<input id="e-it" value="' + esc(w.it) + '" maxlength="120"></label><label class="f">Nome inglese / descrizione inglese<input id="e-en" value="' + esc(w.en || "") + '" maxlength="200"></label></div>' +
      '<label class="f">Descrizione (ingredienti, come sul menu di carta)<input id="e-dit" value="' + esc(w.dit || "") + '" maxlength="300"></label>' +
      '<div class="grid2"><label class="f">Prezzo €<input id="e-price" type="number" min="0" step="0.5" value="' + w.price + '"></label><label class="f">Prezzo<select id="e-unit"><option value=""' + (!w.per2 && !w.perKg ? " selected" : "") + '>a porzione</option><option value="per2"' + (w.per2 ? " selected" : "") + '>per due persone</option><option value="perKg"' + (w.perKg ? " selected" : "") + ">al chilo (si pesa al tavolo, niente pre-ordine)</option></select></label></div>" +
      '<p class="help" style="margin:12px 0 4px">Allergeni</p><div class="chk">' + Object.entries(AL).map(([n, name]) => '<label><input type="checkbox" data-al="' + n + '"' + (w.a.includes(Number(n)) ? " checked" : "") + "> " + n + " " + name + "</label>").join("") + "</div>" +
      '<div class="chk" style="margin-top:12px"><label><input type="checkbox" id="e-v"' + (w.v ? " checked" : "") + "> Vegetariano (V)</label><label><input type=\"checkbox\" id=\"e-star\"" + (w.star ? " checked" : "") + "> * prodotto surgelato all'origine</label><label><input type=\"checkbox\" id=\"e-feature\"" + (w.feature ? " checked" : "") + "> Piatto in evidenza della sala</label><label><input type=\"checkbox\" id=\"e-off\"" + (w.off ? " checked" : "") + "> Nascosto dal sito</label></div>" +
      '<h3 style="margin-top:22px">La foto</h3><p class="help">Una foto vera del piatto sostituisce il disegno ovunque. Dal telefono va benissimo: viene ridotta prima di partire.</p><div class="cover dish"><div id="e-pic">' + (mediaUrl("dish_" + d.id) ? '<img src="' + esc(mediaUrl("dish_" + d.id)) + '" alt="">' : '<span class="nocover" id="e-draw">' + drawing(w, room.wall) + "</span>") + '</div><div class="actions"><button class="btn sm ghost" type="button" id="e-photo">' + (mediaUrl("dish_" + d.id) ? "Cambia la foto" : "Carica una foto") + "</button>" + (mediaUrl("dish_" + d.id) ? '<button class="btn sm danger" type="button" id="e-unphoto">Togli la foto</button>' : "") + "</div></div>" +
      '<h3 style="margin-top:22px">Il disegno</h3><p class="help">Finché non c\'è la foto, il sito disegna il piatto dagli ingredienti, uno alla volta. Scegli la base e aggiungi gli ingredienti nell\'ordine in cui vanno nel piatto.</p>' +
      '<label class="f">Base<select id="e-base">' + bases + '</select></label><div class="steps" id="e-steps"></div><label class="f" style="margin-top:8px">Aggiungi un ingrediente<input id="e-ing" placeholder="cerca: pomodoro, pecorino, tartufo…" autocomplete="off"></label><div class="inglist" id="e-inglist"></div>' +
      '<div class="actions" style="margin-top:22px"><button class="btn" type="button" id="e-save">Salva</button><button class="btn ghost" type="button" id="close">Annulla</button>' + (isNew ? "" : '<button class="btn danger" type="button" id="e-del">Elimina il piatto</button>') + "</div>");
    const redraw = () => { const el = $("#e-draw", dr); if (el) el.innerHTML = drawing(w, room.wall); };
    const steps = () => { $("#e-steps", dr).innerHTML = w.steps.length ? w.steps.map((k, i) => '<span class="chip"><b>' + esc((ART.ING[k] || { it: k }).it) + '</b><button type="button" data-sm="-1" data-i="' + i + '"' + (i === 0 ? " disabled" : "") + ' aria-label="prima">‹</button><button type="button" data-sm="1" data-i="' + i + '"' + (i === w.steps.length - 1 ? " disabled" : "") + ' aria-label="dopo">›</button><button type="button" data-sx="' + i + '" aria-label="togli">✕</button></span>').join("") : '<span class="help">Nessun ingrediente: solo la base.</span>';
      dr.querySelectorAll("[data-sm]").forEach(b => b.addEventListener("click", () => { const i = Number(b.dataset.i), j = i + Number(b.dataset.sm); [w.steps[i], w.steps[j]] = [w.steps[j], w.steps[i]]; steps(); redraw(); }));
      dr.querySelectorAll("[data-sx]").forEach(b => b.addEventListener("click", () => { w.steps.splice(Number(b.dataset.sx), 1); steps(); redraw(); })); };
    const ingSearch = () => { const q = $("#e-ing", dr).value.trim().toLowerCase(); const host = $("#e-inglist", dr); if (q.length < 2) { host.innerHTML = ""; return; }
      const hits = ingList.filter(x => (x.it + " " + x.en + " " + x.k).toLowerCase().includes(q)).slice(0, 24);
      host.innerHTML = hits.length ? hits.map(x => '<button type="button" class="ingbtn" data-add="' + x.k + '"><svg viewBox="0 0 400 300">' + (ART.ING[x.k] || { svg: "" }).svg + "</svg><span>" + esc(x.it) + "</span></button>").join("") : '<span class="help">Nessun ingrediente disegnato con questo nome. Puoi aggiungerne uno nuovo in art.js.</span>';
      host.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => { if (w.steps.length >= 14) return alert("Al massimo 14 ingredienti."); w.steps.push(b.dataset.add); steps(); redraw(); $("#e-ing", dr).value = ""; host.innerHTML = ""; })); };
    steps(); $("#e-ing", dr).addEventListener("input", ingSearch);
    $("#e-base", dr).addEventListener("change", () => { w.base = $("#e-base", dr).value; redraw(); });
    $("#close", dr).addEventListener("click", () => { if (isNew) MENU.rooms[ri].groups[gi].items.splice(ii, 1); dr.remove(); renderRooms(); });
    $("#e-photo", dr).addEventListener("click", async () => { if (await uploadMedia("dish_" + d.id, 1200, 900)) { $("#e-pic", dr).innerHTML = '<img src="' + esc(mediaUrl("dish_" + d.id)) + '" alt="">'; $("#e-photo", dr).textContent = "Cambia la foto"; } });
    const un = $("#e-unphoto", dr); if (un) un.addEventListener("click", async () => { if (await removeMedia("dish_" + d.id)) { $("#e-pic", dr).innerHTML = '<span class="nocover" id="e-draw">' + drawing(w, room.wall) + "</span>"; un.remove(); $("#e-photo", dr).textContent = "Carica una foto"; } });
    const del = $("#e-del", dr); if (del) del.addEventListener("click", () => { if (!confirm("Eliminare “" + d.it + "” dal menu?")) return; MENU.rooms[ri].groups[gi].items.splice(ii, 1); dr.remove(); renderRooms(); scheduleSave(); });
    $("#e-save", dr).addEventListener("click", () => {
      const v = id => $(id, dr).value;
      d.it = v("#e-it").trim() || "—"; d.en = v("#e-en").trim(); d.dit = v("#e-dit").trim(); d.price = Math.max(0, Number(v("#e-price")) || 0);
      d.a = [...dr.querySelectorAll("[data-al]:checked")].map(c => Number(c.dataset.al));
      for (const [f, id] of [["v", "#e-v"], ["star", "#e-star"], ["feature", "#e-feature"], ["off", "#e-off"]]) { if ($(id, dr).checked) d[f] = true; else delete d[f]; }
      delete d.per2; delete d.perKg; if (v("#e-unit") === "per2") d.per2 = true; if (v("#e-unit") === "perKg") d.perKg = true;
      d.base = w.base || "plate"; d.steps = w.steps.slice();
      dr.remove(); renderRooms(); scheduleSave();
    });
  }

      '<div class="actions"><button class="btn" type="submit">Salva</button></div><p class="okmsg" id="lmsg"></p><p class="err" id="lerr2"></p></form>';
    const tables = s.tables.map(t => ({ ...t }));
    const drawTables = () => { $("#tables").innerHTML = tables.map((t, i) => '<div class="grid3"><label class="f">Sala<input data-t="name" data-i="' + i + '" value="' + esc(t.name) + '"></label><label class="f">Lettera<input data-t="sigla" data-i="' + i + '" value="' + esc(t.sigla) + '" maxlength="1" style="text-transform:uppercase"></label><label class="f">Tavoli<input data-t="n" data-i="' + i + '" type="number" min="0" max="60" value="' + t.n + '"></label><button class="btn sm danger" type="button" data-tdel="' + i + '">✕</button></div>').join("");
      $("#tables").querySelectorAll("[data-t]").forEach(inp => inp.addEventListener("input", () => { tables[inp.dataset.i][inp.dataset.t] = inp.dataset.t === "n" ? Number(inp.value) : inp.value; }));
      $("#tables").querySelectorAll("[data-tdel]").forEach(b => b.addEventListener("click", () => { tables.splice(Number(b.dataset.tdel), 1); drawTables(); })); };
    drawTables();
    $("#addtable").addEventListener("click", () => { tables.push({ name: "Sala " + (tables.length + 1), sigla: "ABCDEFGHIJKL"[tables.length] || "Z", n: 8 }); drawTables(); });
    $("#hh-filter").addEventListener("input", () => { const q = $("#hh-filter").value.trim().toLowerCase(); $("#hh-list").querySelectorAll("label").forEach(l => { l.hidden = q && !l.dataset.name.includes(q); }); });
    $("#hh-list").addEventListener("change", () => { $("#hh-n").textContent = $("#hh-list").querySelectorAll("input:checked").length; });
    $("#site").addEventListener("submit", async e => {
      e.preventDefault(); const f = new FormData(e.target); const v = k => f.get(k) || "";
      const b = { name: v("name"), address: v("address"), phone: v("phone"), whatsapp: v("whatsapp"), email: v("email"), instagram: v("instagram"), mapsUrl: v("mapsUrl"), reviewUrl: v("reviewUrl"), hours: { it: v("hours_it"), en: v("hours_en") }, wifi: { name: v("wifi_name"), pass: v("wifi_pass") },
        happyHour: { on: !!f.get("hh_on"), drinks: v("hh_drinks"), price: Number(v("hh_price")) || 0, from: v("hh_from"), to: v("hh_to"), when: { it: v("hh_when_it"), en: v("hh_when_en") }, items: f.getAll("hh_item") }, tables };
      try { const j = await put("/api/admin/site", b); MENU.site = j.site; $("#lmsg").textContent = "Salvato."; $("#lerr2").textContent = ""; } catch (err) { $("#lerr2").textContent = err.message; $("#lmsg").textContent = ""; }
    });
  }

  /* ==================== QR: one code per table, one for the door ==================== */
  async function qr() {
    const m = $("#main"); m.innerHTML = '<p class="help">Un attimo…</p>';
    MENU = await api("/api/admin/menu"); const s = MENU.site;
    const BASE = location.origin.replace(/^http:/, "https:");
    const tables = s.tables.filter(t => t.n > 0);
    const tot = tables.reduce((a, t) => a + t.n, 0);
    m.innerHTML = '<h1>Codici QR</h1><p class="help">Un codice per ogni tavolo: chi lo inquadra apre il menu con il tavolo già segnato (e il Wi-Fi, se l\'avete messo). Il codice “Menu” è per la vetrina e il banco. Scarica i PNG o stampa il foglio; se aggiungi tavoli in “Il locale”, torna qui: i codici nuovi sono già pronti.</p>' +
      '<div class="bar"><button class="btn" type="button" id="qr-all">Scarica tutti i PNG</button><button class="btn ghost" type="button" id="qr-print">Stampa il foglio</button><span class="help">' + tot + " tavoli · i codici portano a " + esc(BASE.replace(/^https?:\/\//, "")) + "/&lt;tavolo&gt;</span></div>" +
      '<h2 class="svc">La porta e il banco</h2><div class="qrgrid"><div class="qrcard casa" data-code="" data-file="qr-menu.png"><canvas></canvas><div class="qcod">MENU</div><div class="qdove">' + esc(BASE.replace(/^https?:\/\//, "")) + '</div><button class="btn sm ghost" type="button" data-dl>Scarica PNG</button></div></div>' +
      (tables.length ? tables.map(t => '<h2 class="svc">' + esc(t.name) + ' <small>' + t.n + " tavoli · 1" + esc(t.sigla) + "–" + t.n + esc(t.sigla) + "</small></h2><div class=\"qrgrid\">" + Array.from({ length: t.n }, (_, i) => { const c = (i + 1) + t.sigla; return '<div class="qrcard" data-code="' + c + '" data-file="qr-' + c + '.png"><canvas></canvas><div class="qcod">' + c + '</div><div class="qdove">' + esc(BASE.replace(/^https?:\/\//, "")) + "/" + c + '</div><button class="btn sm ghost" type="button" data-dl>Scarica PNG</button></div>'; }).join("") + "</div>").join("") : '<p class="empty">Nessun tavolo: aggiungili in “Il locale”.</p>');
    const cards = [...document.querySelectorAll(".qrcard")];
    cards.forEach(card => paintQr(card.querySelector("canvas"), card.dataset.code, s.name, BASE));
    const dl = card => { card.querySelector("canvas").toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = card.dataset.file; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }, "image/png"); };
    cards.forEach(card => card.querySelector("[data-dl]").addEventListener("click", () => dl(card)));
    $("#qr-all").addEventListener("click", () => cards.forEach((c, i) => setTimeout(() => dl(c), i * 350)));
    $("#qr-print").addEventListener("click", () => window.print());
  }
  // The card, drawn like a gallery plaque: cream, a double gold frame, the name, the code, the table.
  function paintQr(canvas, code, name, BASE) {
    const q = qrcode(0, code ? "M" : "Q"); q.addData(BASE + "/" + code); q.make();
    const N = q.getModuleCount(), W = 1000, H = 1400, scale = Math.floor(600 / N), side = scale * N, ox = (W - side) / 2, top = 260;
    canvas.width = W; canvas.height = H;
    const g = canvas.getContext("2d");
    g.fillStyle = "#F6EFE1"; g.fillRect(0, 0, W, H);
    g.strokeStyle = "#C9A55C"; g.lineWidth = 6; g.strokeRect(24, 24, W - 48, H - 48); g.lineWidth = 2; g.strokeRect(40, 40, W - 80, H - 80);
    const spaced = t => t.toUpperCase().split("").join(" ");
    g.textAlign = "center";
    g.fillStyle = "#8A6A2E"; g.font = "500 28px 'Work Sans', system-ui, sans-serif"; g.fillText(spaced(name || "Osteria La Galleria"), W / 2, 120);
    g.fillStyle = "#1E1A17"; g.font = "italic 400 60px 'Bodoni Moda', Georgia, serif"; g.fillText(code ? "Il menu di questo tavolo" : "Il menu", W / 2, 200);
    g.fillStyle = "#FFFFFF"; g.fillRect(ox - 32, top - 32, side + 64, side + 64);
    g.strokeStyle = "#C9A55C"; g.lineWidth = 2; g.strokeRect(ox - 32, top - 32, side + 64, side + 64);
    g.fillStyle = "#000000";
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (q.isDark(r, c)) g.fillRect(ox + c * scale, top + r * scale, scale, scale);
    const below = top + side + 32;
    if (code) {
      g.fillStyle = "#1E1A17"; g.font = "500 170px 'Bodoni Moda', Georgia, serif"; g.fillText(code, W / 2, below + 190);
      g.fillStyle = "#6E6459"; g.font = "500 26px 'Work Sans', system-ui, sans-serif"; g.fillText(spaced("Tavolo · Table"), W / 2, below + 240);
    } else {
      g.fillStyle = "#1E1A17"; g.font = "500 26px 'Work Sans', system-ui, sans-serif"; g.fillText(spaced("Inquadra · Scan"), W / 2, below + 80);
    }
    g.fillStyle = "#6E6459"; g.font = "400 30px 'Work Sans', system-ui, sans-serif";
    g.fillText(code ? "Inquadra per il menu · Scan for the menu" : BASE.replace(/^https?:\/\//, ""), W / 2, H - 96);
  }


  /* ---------- boot ---------- */
  api("/api/admin/me").then(j => { me = j.admin; live = j.live; boot(); }).catch(() => loginView());
})();
</script>
